<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Room Service · Control de Vajilla</title>
<style>
:root{
  --bg:#0d0f11; --panel:#7b7c7e; --panel2:#5d5f62; --tab:#30363c; --tab-act:#777a53;
  --red:#b01226; --green:#007a00; --blue:#336699; --turq:#70b3ae; --gold:#dba95b;
  --olive:#6b8a6a; --key:#64788a; --amar:#f0c000; --purple:#7a6a99;
  --font:"Segoe UI","Segoe UI Variable",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --k:1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--font);color:#fff;user-select:none;-webkit-user-select:none}
input,select,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--k));transform-origin:center center;background:var(--bg);display:grid;grid-template-rows:80px minmax(0,1fr) 78px 36px;overflow:hidden}

/* barra de pestañas */
#tabs{display:flex;gap:8px;padding:8px 8px 6px;background:#000}
#tabs button{flex:1;background:var(--tab);color:#e8e8e8;border:0;font-size:27px;cursor:pointer;letter-spacing:.2px}
#tabs button.act{background:var(--tab-act);color:#fff}
#tabs .sm{display:none}

/* zona principal */
#main{display:grid;grid-template-columns:minmax(0,1fr) 182px;min-height:0;background:#000}
#main.no-rail{grid-template-columns:minmax(0,1fr)}
#main.no-rail #rail{display:none}
#rail{display:flex;flex-direction:column;gap:2px;padding-left:2px;overflow-y:auto;min-height:0}
#rail button{flex:0 0 auto;min-height:76px;background:var(--tab);color:#eee;border:0;font-size:21px;cursor:pointer;padding:6px;line-height:1.15}
#rail button.act{background:var(--tab-act);color:#fff}
#rail .sep{flex:0 0 auto;height:14px}
#content{position:relative;background:var(--panel);min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;min-height:0}
.view.on{display:flex}

/* barra de acciones inferior y barra dorada */
#actions{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#000;padding-top:3px}
.btn{border:0;color:#fff;font-size:25px;cursor:pointer;line-height:1.1;padding:4px 8px}
.btn:active{filter:brightness(.78)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.b-red{background:var(--red)} .b-green{background:var(--green)} .b-blue{background:var(--blue)}
.b-turq{background:var(--turq)} .b-gold{background:var(--gold)} .b-olive{background:var(--olive)}
.b-gray{background:#6a6c6f} .b-purple{background:var(--purple)} .b-dark{background:var(--tab)}
#status{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#000;padding:2px 4px 4px}
#status div{background:var(--gold);color:#fff;text-align:center;font-size:19px;line-height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status div.clk{cursor:pointer}
#status div.alert{background:var(--red);font-weight:700}
#status .fast{display:inline-block;background:#fff;color:#a8630f;padding:0 8px;margin-left:8px;font-weight:700;line-height:22px}

/* franjas de filtros */
.strip{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--panel2);flex:0 0 auto;flex-wrap:wrap}
.strip input,.strip select{height:54px;font-size:22px;padding:0 14px;border:1px solid #222;background:#fff;color:#111;border-radius:2px;min-width:250px}
.strip .grow{flex:1}
.strip .btn{height:54px;padding:0 18px;font-size:21px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:0 14px;height:54px;font-size:20px;font-weight:700;border:0;cursor:pointer;color:#fff;border:2px solid rgba(0,0,0,.3)}
.chip b{font-size:26px}

/* estados / colores de órdenes */
.k-PREPARACION{background:#f4f4f4;color:#14161a}
.k-SIN_ASIGNAR{background:#b3b5b8;color:#14161a}
.k-ASIGNADO{background:var(--blue);color:#fff}
.k-VERDE{background:var(--green);color:#fff}
.k-AMARILLO{background:var(--amar);color:#1a1500}
.k-ROJO{background:var(--red);color:#fff}
.k-RETIRADO{background:#000;color:#fff}
.k-LIBRE{background:#6a6c6f;color:#ddd}
.card.k-ROJO,.rcard.k-ROJO{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,80,80,0)}50%{box-shadow:0 0 0 7px rgba(255,90,90,.6)}}

/* tablero */
.cols{flex:1;display:grid;gap:6px;padding:8px;min-height:0;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;min-height:0;background:#6a6c6f;border-radius:2px}
.col-h{flex:0 0 auto;padding:10px 12px;background:var(--tab);display:flex;justify-content:space-between;font-size:22px;font-weight:600}
.col-b{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:0}
.empty{padding:30px 10px;text-align:center;font-size:20px;opacity:.7}
.card{position:relative;flex:0 0 auto;border-radius:3px;cursor:pointer;padding:8px 14px 8px;border:3px solid rgba(0,0,0,.25)}
.card.ro{cursor:default}
.c-top{display:flex;justify-content:space-between;font-size:20px;font-weight:600;opacity:.9}
.c-room{font-size:60px;font-weight:700;line-height:1.05}
.c-state{font-size:19px;font-weight:700;letter-spacing:.6px}
.c-meta{display:flex;justify-content:space-between;align-items:center;font-size:19px;margin-top:2px;min-height:34px}
.c-time{font-variant-numeric:tabular-nums;font-size:32px;font-weight:700}
.c-btns{display:flex;gap:6px;margin-top:6px}
.mini{border:0;background:rgba(0,0,0,.28);color:inherit;font-size:16px;padding:7px 12px;cursor:pointer;border-radius:2px;font-weight:600}
.k-PREPARACION .mini,.k-SIN_ASIGNAR .mini,.k-AMARILLO .mini{background:rgba(0,0,0,.16)}
.mini:active{filter:brightness(.7)}

/* runner */
.rgrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(410px,1fr));gap:10px;padding:10px;align-content:start;min-height:0}
.rcard{position:relative;border-radius:4px;min-height:280px;display:flex;flex-direction:column;cursor:pointer;border:4px solid rgba(0,0,0,.3);overflow:hidden}
.r-top{padding:12px 16px 0;display:flex;justify-content:space-between;font-size:28px;font-weight:600}
.r-timer{font-variant-numeric:tabular-nums;font-weight:700}
.r-room{font-size:120px;font-weight:700;line-height:1;text-align:center;padding:2px 0}
.r-state{text-align:center;font-size:32px;font-weight:700;letter-spacing:.5px}
.r-who{text-align:center;font-size:22px;opacity:.9;min-height:30px}
.r-act{margin-top:auto;background:rgba(0,0,0,.34);color:#fff;text-align:center;font-size:25px;font-weight:700;padding:14px 6px;white-space:nowrap;letter-spacing:.4px}
.r-undo{position:absolute;right:10px;top:84px;width:58px;height:54px;font-size:26px;font-weight:700;border-radius:3px}

/* operadora */
.op{flex:1;display:grid;grid-template-columns:690px minmax(0,1fr);gap:10px;padding:10px;min-height:0}
.op-left{background:var(--panel2);padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.op-title{font-size:28px;font-weight:600}
.fld{background:#fff;color:#111;border:5px solid #fff;padding:4px 14px;cursor:pointer}
.fld.act{border-color:var(--gold)}
.fld label{display:block;font-size:16px;color:#666;font-weight:700;letter-spacing:.5px}
.fld .val{font-size:46px;min-height:58px;font-weight:600;letter-spacing:1px}
.opmsg{min-height:34px;font-size:20px;font-weight:600}
.opmsg.ok{color:#bff0b0}.opmsg.err{color:#ffc2c2}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;flex:1;min-height:0}
.pad button{border:0;background:var(--key);color:#fff;font-size:40px;cursor:pointer;min-height:70px}
.pad button:active{filter:brightness(.75)}
.pad .wide{grid-column:span 3}
.pad button.sm{font-size:28px}
.op-right{display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px;min-height:0}
.box{background:var(--panel2);display:flex;flex-direction:column;min-height:0}
.box h2{padding:10px 14px;background:var(--tab);font-size:24px;font-weight:600;flex:0 0 auto;display:flex;justify-content:space-between}
.tbl-wrap{overflow:auto;flex:1;min-height:0}
table.t{width:100%;border-collapse:collapse;font-size:20px;color:#fff}
.t th{position:sticky;top:0;background:var(--tab);text-align:left;padding:10px 12px;font-weight:600;white-space:nowrap;z-index:1}
.t td{padding:8px 12px;border-bottom:1px solid rgba(0,0,0,.25);white-space:nowrap}
.t tr:nth-child(even) td{background:rgba(255,255,255,.05)}
.t tr.clk{cursor:pointer}
.pill{display:inline-block;padding:2px 12px;border-radius:2px;font-weight:700;font-size:17px;border:1px solid rgba(0,0,0,.35)}
.t .mini{background:var(--tab);color:#fff;font-size:17px;padding:6px 12px}
.num{font-variant-numeric:tabular-nums}

/* base de datos */
.dbbody{flex:1;overflow:auto;min-height:0;padding:0}
.pad-in{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--tab);padding:12px 16px}
.kpi b{display:block;font-size:44px;font-weight:700;line-height:1.1}
.kpi span{font-size:18px;opacity:.85}
.kpi.k-ROJO{background:var(--red)}
.h2{font-size:24px;font-weight:600;margin:14px 0 8px}
.bars .br{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:19px}
.bars .br i{flex:0 0 120px;font-style:normal}
.bars .br u{display:block;height:24px;background:var(--turq);text-decoration:none}
.bars .br em{font-style:normal;font-weight:700}
.fmap{padding:12px}
.fmap-row{display:flex;gap:4px;align-items:center;margin-bottom:3px}
.fmap-row .fl{flex:0 0 70px;font-size:18px;font-weight:700;text-align:right;padding-right:8px}
.fcell{width:66px;height:34px;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid rgba(0,0,0,.45);font-weight:600}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.legend span{padding:4px 12px;font-size:17px;font-weight:700;border:1px solid rgba(0,0,0,.4)}

/* asistente */
.ai{flex:1;display:flex;flex-direction:column;min-height:0}
.ai-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:78%;padding:12px 18px;font-size:23px;line-height:1.35;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.msg.u{align-self:flex-end;background:var(--blue)}
.msg.b{align-self:flex-start;background:var(--tab)}
.msg .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg .acts button{border:0;color:#fff;font-size:20px;padding:10px 18px;cursor:pointer}
.ai-chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 14px;background:var(--panel2);flex:0 0 auto}
.ai-chips button{border:0;background:var(--tab);color:#fff;font-size:19px;padding:10px 16px;cursor:pointer}
.ai-in{display:flex;gap:6px;padding:10px 14px;background:var(--panel2);flex:0 0 auto}
.ai-in input{flex:1;height:64px;font-size:25px;padding:0 16px;border:0;background:#fff;color:#111}
.ai-in .btn{width:220px;font-size:24px}

/* configuración */
.cfg{flex:1;overflow:auto;padding:18px 22px;min-height:0}
.cfg h2{font-size:30px;font-weight:600;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;font-size:23px}
.row .lbl{flex:0 0 360px}
.row .btn{min-width:110px;height:62px;font-size:22px}
.row .btn.sel{background:var(--tab-act);outline:3px solid #fff}
.row input[type=text],.row input[type=password],.row input[type=number],.row select{height:58px;font-size:22px;padding:0 14px;border:0;background:#fff;color:#111;min-width:380px}
.note{font-size:18px;opacity:.88;max-width:1100px;line-height:1.35;margin-bottom:14px}
.val-big{font-size:34px;font-weight:700;min-width:90px;text-align:center}

/* diálogos estilo Simphony */
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
.dlg{background:#fff;color:#111;min-width:640px;max-width:1400px;max-height:94%;display:flex;flex-direction:column;border:2px solid #cfcfcf;box-shadow:0 10px 60px rgba(0,0,0,.6)}
.dlg h3{background:var(--gold);color:#fff;font-size:26px;padding:8px 14px;font-weight:700}
.dlg .body{padding:16px 22px;font-size:23px;overflow:auto;line-height:1.4;user-select:text;-webkit-user-select:text}
.dlg .btns{display:flex;gap:6px;justify-content:center;padding:12px;flex-wrap:wrap}
.dlg .btns button{min-width:190px;height:64px;border:0;font-size:22px;color:#fff;background:var(--gold);cursor:pointer;padding:0 14px}
.dlg .btns button:active{filter:brightness(.8)}
.dlg table{border-collapse:collapse;width:100%;font-size:20px;color:#111}
.dlg th{background:#e9e9e9;text-align:left;padding:6px 10px}
.dlg td{padding:6px 10px;border-bottom:1px solid #ddd}
.dlg .kv{display:grid;grid-template-columns:230px 1fr;gap:4px 14px;margin-bottom:12px}
.dlg .kv b{color:#555}
.dlg .tgrid{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.dlg .tgrid button{min-width:130px;height:62px;border:0;background:var(--tab);color:#fff;font-size:22px;cursor:pointer}
.dlg .tgrid button.sel{background:var(--tab-act);outline:3px solid var(--gold)}
.dlg input,.dlg select{height:54px;font-size:22px;padding:0 12px;border:1px solid #888;width:100%;margin-bottom:10px}
.dlg label{font-size:18px;color:#555;font-weight:600}

#toast{position:absolute;left:50%;bottom:140px;transform:translateX(-50%);padding:16px 34px;font-size:26px;font-weight:600;background:#1b1d20;color:#fff;border-left:10px solid var(--gold);z-index:60;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90%}
#toast.err{border-left-color:var(--red)}#toast.ok{border-left-color:#3bb33b}

/* inicio de sesión */
#login{position:absolute;inset:0;z-index:40;background:
  radial-gradient(ellipse at 20% 30%,rgba(224,160,70,.35),transparent 55%),
  radial-gradient(ellipse at 80% 80%,rgba(224,140,40,.25),transparent 50%),
  linear-gradient(135deg,#17110c,#35260f 55%,#14161a);display:flex;align-items:center;justify-content:space-around}
#login.off{display:none}
.lg-brand{font-family:Georgia,"Times New Roman",serif;font-size:190px;line-height:.95;color:rgba(255,255,255,.62);padding-left:60px;max-width:1000px}
.lg-brand small{display:block;font-family:var(--font);font-size:34px;letter-spacing:6px;color:rgba(255,255,255,.7);margin-top:20px}
.lg-box{width:480px;margin-right:100px}
.lg-fld{background:#fff;color:#111;height:112px;font-size:60px;letter-spacing:10px;padding:0 20px;display:flex;align-items:center;margin-bottom:3px}
.lg-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.lg-pad button{height:128px;border:0;background:rgba(80,100,125,.82);color:#fff;font-size:40px;cursor:pointer}
.lg-pad button:active{filter:brightness(.7)}
.lg-pad .clr{background:var(--red)} .lg-pad .go{background:var(--green)}
.lg-err{min-height:44px;margin-top:10px;font-size:24px;color:#ffb3b3;font-weight:600}
.lg-demo{position:absolute;left:0;bottom:0;height:80px;width:320px;background:var(--tab);color:#fff;border:0;font-size:24px;cursor:pointer}

/* móvil / vertical */
#stage.portrait{width:720px}
#stage.portrait{grid-template-rows:64px minmax(0,1fr) 70px 34px}
.portrait #tabs{gap:4px;padding:6px 4px 4px}
.portrait #tabs button{font-size:19px;padding:0 2px}
.portrait #tabs .lg{display:none}.portrait #tabs .sm{display:inline}
.portrait #main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.portrait #rail{grid-row:1;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.portrait #content{grid-row:2}
.portrait #rail button{min-width:130px;min-height:60px;font-size:17px}
.portrait .btn{font-size:17px}
.portrait #status div{font-size:14px}
.portrait .cols{grid-auto-columns:300px;overflow-x:auto}
.portrait .strip input,.portrait .strip select{min-width:200px;height:48px;font-size:18px}
.portrait .op{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto;overflow:auto;display:block}
.portrait .op-left{margin-bottom:10px}
.portrait .op-right{display:block}
.portrait .op-right .box{margin-bottom:10px;max-height:420px}
.portrait .pad button{min-height:78px;font-size:34px}
.portrait .rgrid{grid-template-columns:minmax(0,1fr)}
.portrait .rcard{min-height:310px}.portrait .r-room{font-size:96px}.portrait .r-undo,.portrait .r-info{top:72px}
.portrait .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
.portrait .row .lbl{flex:0 0 100%}
.portrait .row input[type=text],.portrait .row input[type=password],.portrait .row select{min-width:100%}
.portrait .dlg{min-width:0;width:96%}
.portrait .dlg .btns button{min-width:140px;font-size:18px;height:54px}
.portrait .dlg .kv{grid-template-columns:150px 1fr}
.portrait .msg{max-width:92%;font-size:19px}
.portrait .lg-brand{display:none}
.portrait #login{justify-content:center}
.portrait .lg-box{margin:0}
.portrait .fcell{width:44px;font-size:13px}
.portrait .fmap-row .fl{flex:0 0 48px;font-size:14px}
.portrait .ai-in .btn{width:130px}
.portrait .tbl-wrap,.portrait .dbbody{overflow:auto}

.k-ANULADA{background:#444;color:#aaa}
.chip.off{opacity:.38;filter:grayscale(.7)}
.r-info{position:absolute;left:10px;top:84px;width:58px;height:54px;font-size:26px;font-weight:700;border-radius:3px}
.chip.k-PREPARACION,.chip.k-SIN_ASIGNAR,.chip.k-AMARILLO{border-color:rgba(0,0,0,.4)}
.dlg .btns button.sel{outline:3px solid #fff}
.bars .br u.k-PREPARACION,.bars .br u.k-SIN_ASIGNAR,.bars .br u.k-ASIGNADO,.bars .br u.k-VERDE,.bars .br u.k-AMARILLO,.bars .br u.k-ROJO,.bars .br u.k-RETIRADO{border:1px solid rgba(255,255,255,.25)}

.rgrid{grid-auto-rows:max-content}
.rcard{overflow:visible}
.rcard>*{flex-shrink:0}
.gd{flex:1;overflow:auto;padding:18px 26px;min-height:0}
.gd h2{font-size:32px;font-weight:600;margin-bottom:12px}
.gd h3{font-size:25px;font-weight:600;margin:18px 0 8px;color:#ffe9b8}
.gd p,.gd li{font-size:22px;line-height:1.45;max-width:1300px;user-select:text;-webkit-user-select:text}
.gd p{margin-bottom:12px}
.gd ul,.gd ol{margin:0 0 12px 32px}
.gd li{margin-bottom:7px}
.gd table{border-collapse:collapse;margin:8px 0 16px;font-size:20px;max-width:1350px;width:100%}
.gd th{background:var(--tab);text-align:left;padding:10px 12px}
.gd td{padding:9px 12px;border-bottom:1px solid rgba(0,0,0,.3);vertical-align:top;line-height:1.35}
.gd .tip{background:rgba(0,0,0,.28);border-left:8px solid var(--gold);padding:12px 18px;margin:12px 0;font-size:21px;line-height:1.4;max-width:1300px}
.gd .sw{display:inline-block;padding:2px 10px;font-weight:700;font-size:17px;border:1px solid rgba(0,0,0,.4);margin-right:6px}
.msn{display:flex;gap:12px;align-items:flex-start;background:rgba(0,0,0,.22);margin-bottom:8px;padding:10px 12px;max-width:1350px}
.msn .ck{flex:0 0 58px;height:58px;border:0;background:var(--tab);color:#fff;font-size:34px;cursor:pointer}
.msn.done .ck{background:var(--green)}
.msn .tx{flex:1;font-size:21px;line-height:1.4}
.msn .tx b{font-size:23px}
.msn .go{flex:0 0 200px;min-height:58px;border:0;background:var(--blue);color:#fff;font-size:20px;cursor:pointer;padding:4px 8px}
.portrait .gd{padding:12px}
.portrait .gd p,.portrait .gd li{font-size:17px}
.portrait .gd table{font-size:15px;display:block;overflow-x:auto}
.portrait .gd .tip{font-size:16px}
.portrait .msn{flex-wrap:wrap}.portrait .msn .go{flex:1 1 100%}
</style>
</head>
<body>
<div id="stage">
  <div id="tabs"></div>
  <div id="main">
    <div id="content">
      <div class="view" id="v-op"></div>
      <div class="view" id="v-board"></div>

<script>
'use strict';
/* ================= utilidades ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const LS_KEY='riss_vajilla_v2';
const memStore={};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]==null?null:memStore[k]}},set(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=v}}};
const sess={get(k){try{return sessionStorage.getItem(k)}catch(e){return memStore['s_'+k]==null?null:memStore['s_'+k]}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){memStore['s_'+k]=v}},del(k){try{sessionStorage.removeItem(k)}catch(e){delete memStore['s_'+k]}}};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

/* ================= hotel: 187 habitaciones ================= */
const FLOORS=[];for(let p=7;p<=25;p++)FLOORS.push({piso:p,n:p<=19?11:p<=24?8:4});
const ROOMS=[];FLOORS.forEach(f=>{for(let i=1;i<=f.n;i++)ROOMS.push(f.piso*100+i)});
function validarHab(txt){
  txt=String(txt||'').trim();
  if(!/^\d{3,4}$/.test(txt))return{ok:false,msg:'Habitación inválida (ej. 1204)'};
  const h=+txt,piso=Math.floor(h/100),n=h%100,f=FLOORS.find(x=>x.piso===piso);
  if(!f)return{ok:false,msg:`El piso ${piso} no existe (pisos 7 al 25)`};
  if(n<1||n>f.n)return{ok:false,msg:`Piso ${piso}: habitaciones ${piso*100+1} a ${piso*100+f.n}`};
  return{ok:true,hab:h,piso};
}

/* ================= roles y permisos ================= */
const ROLES={operadora:'Operadora',runner:'Runner',supervisor:'Supervisor A&B',admin:'Administrador'};
const PERM={
  operadora:{tabs:['op','board','db','ai','guide'],reg:true,adv:false,anular:'prep',usersDb:false,admin:false},
  runner:{tabs:['runner','board','db','ai','guide'],reg:false,adv:true,anular:false,usersDb:false,admin:false},
  supervisor:{tabs:['op','board','runner','db','ai','guide','cfg'],reg:true,adv:true,anular:'all',usersDb:true,admin:false},
  admin:{tabs:['op','board','runner','db','ai','guide','cfg'],reg:true,adv:true,anular:'all',usersDb:true,admin:true}
};
const DEFAULT_USERS=[
  {name:'Operadora Instant',pin:'1111',rol:'operadora'},
  {name:'Ana',pin:'2001',rol:'runner'},
  {name:'Luis',pin:'2002',rol:'runner'},
  {name:'Marta',pin:'2003',rol:'runner'},
  {name:'Eric',pin:'3001',rol:'supervisor'},
  {name:'Admin',pin:'0000',rol:'admin'}
];

/* ================= estados ================= */
const MIN=60000;
const LEVELS=['PREPARACION','SIN_ASIGNAR','ASIGNADO','VERDE','AMARILLO','ROJO','RETIRADO'];
const NV={
  PREPARACION:{label:'EN PREPARACIÓN',chip:'EN PREPARACIÓN'},
  SIN_ASIGNAR:{label:'SIN ASIGNAR',chip:'SIN ASIGNAR'},
  ASIGNADO:{label:'ASIGNADO',chip:'ASIGNADO'},
  VERDE:{label:'ENTREGADO',chip:'ENTREGADO'},
  AMARILLO:{label:'PRE-AVISO DE RETIRO',chip:'PRE-AVISO'},
  ROJO:{label:'RECOLECCIÓN',chip:'RECOLECCIÓN'},
  RETIRADO:{label:'RETIRADO',chip:'RETIRADO'},
  ANULADA:{label:'ANULADA',chip:'ANULADA'}
};
const FILT_DEFAULT=()=>({PREPARACION:1,SIN_ASIGNAR:1,ASIGNADO:1,VERDE:1,AMARILLO:1,ROJO:1,RETIRADO:0});

/* ================= estado global + persistencia ================= */
let S=null;
function defaults(){
  const n=Date.now();
  return{v:2,seq:0,orders:[],users:DEFAULT_USERS.map(u=>({...u})),log:[],undo:[],
    cfg:{amarillo:45,rojo:60,sound:true,demo:true,apiKey:'',model:'claude-sonnet-5-5'},
    clock:{aReal:n,aSim:n,speed:1}};
}
function normalizeState(d){
  const b=defaults();
  const s=Object.assign(b,d||{});
  s.cfg=Object.assign(b.cfg,(d&&d.cfg)||{});
  s.clock=Object.assign({aReal:Date.now(),aSim:Date.now(),speed:1},(d&&d.clock)||{});
  if(!Array.isArray(s.orders))s.orders=[];
  if(!Array.isArray(s.users)||!s.users.length)s.users=DEFAULT_USERS.map(u=>({...u}));
  if(!Array.isArray(s.log))s.log=[];
  if(!Array.isArray(s.undo))s.undo=[];
  s.orders.forEach(o=>{if(!o.uid)o.uid=++s.seq;if(!o.stack)o.stack=[];if(!o.t)o.t={}});
  s.seq=Math.max(s.seq||0,...s.orders.map(o=>o.uid),0);
  return s;
}
function load(){
  let raw=store.get(LS_KEY);
  if(raw){try{return normalizeState(JSON.parse(raw))}catch(e){}}
  S=defaults();seedDemo();return S;
}
function save(){try{store.set(LS_KEY,JSON.stringify(S))}catch(e){}}

/* ================= reloj (con simulación acelerada) ================= */
function simNow(){const c=S.clock;return c.aSim+(Date.now()-c.aReal)*c.speed}
function setSpeed(v){const n=simNow();S.clock={aReal:Date.now(),aSim:n,speed:v};save()}
function jumpClock(min){S.clock.aSim+=min*MIN;save()}
function fmtDur(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+p2(s%60)}
function fmtTime(ts){if(!ts)return'—';const d=new Date(ts);return`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}
function fmtDT(ts){const d=new Date(ts);return`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${fmtTime(ts)}`}
function fmtMin(n){return n==null?'—':n.toFixed(1)+' min'}

/* ================= órdenes ================= */
const getOrder=uid=>S.orders.find(o=>o.uid===+uid);
function nivel(o,now){
  if(o.estado==='ANULADA')return'ANULADA';
  if(o.estado!=='ENTREGADO')return o.estado;
  const m=((now==null?simNow():now)-o.t.entregado)/MIN;
  if(m>=S.cfg.rojo)return'ROJO';
  if(m>=S.cfg.amarillo)return'AMARILLO';
  return'VERDE';
}
function logEv(ts,user,rol,accion,o,de,a,nota){
  S.log.push({ts,user:user||'—',rol:rol||'',accion,orden:o.id,hab:o.hab,uid:o.uid,de:de||'',a:a||'',nota:nota||''});
  if(S.log.length>3000)S.log.splice(0,S.log.length-3000);
}
function curUser(){const n=sess.get('riss_user');return S.users.find(u=>u.name===n)||null}
function logNow(accion,o,de,a,nota){const u=curUser();logEv(simNow(),u&&u.name,u&&u.rol,accion,o,de,a,nota)}

function snapOf(o){return JSON.parse(JSON.stringify({estado:o.estado,asignado:o.asignado||null,t:o.t,entregado_por:o.entregado_por||null,retirado_por:o.retirado_por||null,anticipado:!!o.anticipado}))}
function stepOrder(o,time,uname){
  const snap=snapOf(o),de=nivel(o,time);
  if(o.estado==='PREPARACION'){o.estado='SIN_ASIGNAR';o.t.sin_asignar=time}
  else if(o.estado==='SIN_ASIGNAR'){o.estado='ASIGNADO';o.asignado=uname;o.t.asignado=time}
  else if(o.estado==='ASIGNADO'){o.estado='ENTREGADO';o.t.entregado=time;o.entregado_por=uname}
  else if(o.estado==='ENTREGADO'){o.estado='RETIRADO';o.t.retirado=time;o.retirado_por=uname;o.anticipado=((time-o.t.entregado)/MIN)<S.cfg.rojo}
  else return null;
  o.stack.push(snap);
  return{de,a:nivel(o,time)};
}
function advance(uid){
  const o=getOrder(uid),u=curUser();if(!o||!u)return null;
  const r=stepOrder(o,simNow(),u.name);if(!r)return null;
  S.undo.push(o.uid);logNow('AVANCE',o,r.de,r.a);save();return{o,...r};
}
function restoreSnap(o,p){o.estado=p.estado;o.asignado=p.asignado;o.t=p.t;o.entregado_por=p.entregado_por;o.retirado_por=p.retirado_por;o.anticipado=p.anticipado}
function anularOrder(uid,fromUndo){
  const o=getOrder(uid);if(!o||o.estado==='ANULADA'||o.estado==='RETIRADO')return false;
  const de=nivel(o);o.stack.push(snapOf(o));o.estado='ANULADA';
  if(!fromUndo)S.undo.push(o.uid);
  logNow('ANULAR',o,de,'ANULADA');save();return true;
}
function undoOrder(uid){
  const o=getOrder(uid);if(!o)return false;
  if(!o.stack.length&&o.estado==='PREPARACION'){
    const i=S.undo.lastIndexOf(o.uid);if(i>=0)S.undo.splice(i,1);
    return anularOrder(uid,true);
  }
  if(!o.stack.length)return false;
  const de=nivel(o),p=o.stack.pop();restoreSnap(o,p);
  const i=S.undo.lastIndexOf(o.uid);if(i>=0)S.undo.splice(i,1);
  logNow('DESHACER',o,de,nivel(o));save();return true;
}
function undoLast(){
  while(S.undo.length){
    const uid=S.undo[S.undo.length-1],o=getOrder(uid);
    if(!o){S.undo.pop();continue}
    return undoOrder(uid)?o:null;
  }
  return null;
}
function createOrder(idTxt,habTxt){
  let id=String(idTxt||'').trim();
  if(!/^\d{1,8}$/.test(id))return{ok:false,msg:'Ingrese el ID Symphony (solo números)'};
  id=id.replace(/^0+(?=\d)/,'');
  const v=validarHab(habTxt);if(!v.ok)return v;
  if(S.orders.some(o=>o.id===id&&o.estado!=='ANULADA'))return{ok:false,msg:`El ID #${id} ya existe (no se permiten duplicados)`};
  const u=curUser(),o={uid:++S.seq,id,hab:v.hab,piso:v.piso,estado:'PREPARACION',asignado:null,t:{registrado:simNow()},stack:[],creado_por:u?u.name:'—'};
  S.orders.push(o);S.undo.push(o.uid);logNow('REGISTRO',o,'','PREPARACION');save();
  return{ok:true,o};
}

/* ================= métricas ================= */
function metrics(){
  const now=simNow(),A=S.orders.filter(o=>o.estado!=='ANULADA');
  const by={};LEVELS.forEach(k=>by[k]=0);A.forEach(o=>by[nivel(o,now)]++);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const ret=A.filter(o=>o.estado==='RETIRADO').map(o=>(o.t.retirado-o.t.entregado)/MIN);
  const ent=A.filter(o=>o.t.entregado).map(o=>(o.t.entregado-o.t.registrado)/MIN);
  const pisos={};A.filter(o=>o.estado==='ENTREGADO').forEach(o=>{pisos[o.piso]=(pisos[o.piso]||0)+1});
  return{total:A.length,by,activas:A.filter(o=>o.estado!=='RETIRADO').length,avgRet:avg(ret),avgEnt:avg(ent),pisos,anuladas:S.orders.length-A.length};
}
const minEnHab=(o,now)=>o.t.entregado?((o.estado==='RETIRADO'?o.t.retirado:now)-o.t.entregado)/MIN:null;

/* ================= datos de ejemplo ================= */
function seedDemo(){
  const now=simNow();S.orders=[];S.log=[];S.undo=[];
  const ops='Operadora Instant';
  const order=['SIN_ASIGNAR','ASIGNADO','ENTREGADO','RETIRADO'];
  // id, hab, estado final, min desde registro, min desde entrega, min desde retiro, cuenta que opera
  const spec=[
    [88391,1909,'RETIRADO',210,190,95,'Marta'],
    [88392,1106,'RETIRADO',150,138,70,'Ana'],
    [88410,1204,'ENTREGADO',92,83,0,'Ana'],
    [88411,905,'ENTREGADO',80,66,0,'Luis'],
    [88412,2203,'ENTREGADO',70,56,0,'Ana'],
    [88413,1511,'ENTREGADO',64,48,0,'Marta'],
    [88414,710,'ENTREGADO',44,31,0,'Luis'],
    [88415,1802,'ENTREGADO',22,12,0,'Marta'],
    [88416,2501,'ASIGNADO',9,0,0,'Luis'],
    [88417,1008,'ASIGNADO',6,0,0,'Ana'],
    [88418,1307,'SIN_ASIGNAR',4,0,0,'Ana'],
    [88419,2406,'PREPARACION',2,0,0,'Ana'],
    [88420,811,'PREPARACION',1,0,0,'Ana']
  ];
  spec.forEach(([id,hab,fin,reg,ent,ret,who])=>{
    const v=validarHab(String(hab)),t0=now-reg*MIN;
    const o={uid:++S.seq,id:String(id),hab,piso:v.piso,estado:'PREPARACION',asignado:null,t:{registrado:t0},stack:[],creado_por:ops};
    logEv(t0,ops,'operadora','REGISTRO',o,'','PREPARACION');
    const times=[t0+MIN,t0+3*MIN,now-ent*MIN,now-ret*MIN],last=order.indexOf(fin);
    for(let i=0;i<=last;i++){const r=stepOrder(o,times[i],who);if(r)logEv(times[i],who,'runner','AVANCE',o,r.de,r.a)}
    S.orders.push(o);
  });
  S.log.sort((a,b)=>a.ts-b.ts);
  S.clock={aReal:Date.now(),aSim:now,speed:1};
  save();
}
/* ================= UI: estado, helpers ================= */
const UI={tab:'board',sub:'resumen',filt:FILT_DEFAULT(),mine:false,q:'',opF:'id',opId:'',opHab:'',opMsg:null,
  dbq:'',dbst:'',aiMsgs:[],aiBusy:false,aiHist:[],pin:'',cfgMsg:'',gsub:'concepto'};
const TABS=[
  {k:'op',lg:'Operadora',sm:'Operadora'},{k:'board',lg:'Tablero A&B',sm:'Tablero'},{k:'runner',lg:'Runner',sm:'Runner'},
  {k:'db',lg:'Base de datos',sm:'Datos'},{k:'ai',lg:'Asistente IA',sm:'IA'},{k:'cfg',lg:'Configuración',sm:'Config.'},{k:'guide',lg:'Guía',sm:'Guía'}];
const C={red:'#b01226',green:'#007a00',blue:'#336699',gray:'#6a6c6f',turq:'#70b3ae'};
const cur=curUser;
const can=p=>{const u=cur();return!!(u&&PERM[u.rol][p])};
const ACT={};

function fit(){
  const w=window.innerWidth,h=window.innerHeight,st=$('#stage');
  let W=1920,H=1080,k=Math.min(w/1920,h/1080);
  if(w/h<0.85){W=720;H=Math.round(720*h/w);k=w/720;st.classList.add('portrait')}else st.classList.remove('portrait');
  st.style.width=W+'px';st.style.height=H+'px';st.style.setProperty('--k',k);
}
function toast(msg,type){
  const t=$('#toast');t.textContent=msg;t.className=type||'';t.style.display='block';
  clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.display='none'},2600);
}
function dlg({title,body,buttons}){
  const m=$('#modal');
  m.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3><div class="body">${body||''}</div><div class="btns"></div></div>`;
  const bx=$('.btns',m);
  (buttons||[{label:'Cerrar'}]).forEach(b=>{
    const x=document.createElement('button');x.textContent=b.label;if(b.bg)x.style.background=b.bg;
    x.onclick=()=>{if(!b.keep)closeDlg();if(b.fn)b.fn()};bx.appendChild(x);
  });
  m.classList.add('on');
}
function closeDlg(){const m=$('#modal');m.classList.remove('on');m.innerHTML=''}
function confirmDlg(title,msg,okLabel,fn,bg){
  dlg({title,body:msg,buttons:[{label:okLabel,bg:bg||C.green,fn},{label:'Cancelar',bg:C.gray}]});
}
function download(name,text,mime){
  const b=new Blob([text],{type:mime}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},600);
}
const stamp=()=>{const d=new Date(simNow());return`${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}`};
function pill(k){return`<span class="pill k-${k}">${NV[k].chip}</span>`}

/* ================= render general ================= */
const RENDER={};
function render(){
  const u=cur();if(!u){showLogin();return}
  $('#login').classList.add('off');
  if(!PERM[u.rol].tabs.includes(UI.tab))UI.tab=PERM[u.rol].tabs[0];
  if(UI.tab==='db'&&UI.sub==='usuarios'&&!can('usersDb'))UI.sub='resumen';
  renderTabs();renderRail();renderActions();renderStatus();
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+UI.tab));
  const el=$('#v-'+UI.tab);
  const sc=$$('.rgrid,.cfg,.dbbody,.col-b,.tbl-wrap,.ai-log',el).map(x=>x.scrollTop);
  RENDER[UI.tab]();
  $$('.rgrid,.cfg,.dbbody,.col-b,.tbl-wrap',el).forEach((x,i)=>{if(sc[i])x.scrollTop=sc[i]});
}
function renderTabs(){
  const u=cur();
  $('#tabs').innerHTML=TABS.filter(t=>PERM[u.rol].tabs.includes(t.k)).map(t=>
    `<button data-act="tab" data-arg="${t.k}" class="${UI.tab===t.k?'act':''}"><span class="lg">${t.lg}</span><span class="sm">${t.sm}</span></button>`).join('');
}
const SUBS=[['resumen','Resumen'],['ordenes','Órdenes'],['mapa','Mapa de pisos'],['bitacora','Bitácora'],['usuarios','Usuarios']];
function renderRail(){
  const show=UI.tab==='db'||UI.tab==='guide';
  $('#main').classList.toggle('no-rail',!show);
  let h='';
  if(UI.tab==='db')h=SUBS.filter(([k])=>k!=='usuarios'||can('usersDb')).map(([k,l])=>`<button data-act="sub" data-arg="${k}" class="${UI.sub===k?'act':''}">${l}</button>`).join('');
  else if(UI.tab==='guide')h=GSUBS.map(([k,l])=>`<button data-act="sub" data-arg="${k}" class="${UI.gsub===k?'act':''}">${l}</button>`).join('');
  $('#rail').innerHTML=h;
}
function renderStatus(){
  const u=cur();if(!u)return;
  const now=simNow(),rojo=S.orders.filter(o=>nivel(o,now)==='ROJO').length,sp=S.clock.speed;
  $('#status').innerHTML=
    `<div class="clk" data-act="logout">${esc(u.name)}${u.name===ROLES[u.rol]?'':' · '+ROLES[u.rol]}</div>`+
    `<div class="clk" data-act="clock">${fmtDT(now)}</div>`+
    `<div class="clk ${rojo?'alert':''}" data-act="goRojo">Por retirar: ${rojo}</div>`+
    `<div class="clk" data-act="clock">Velocidad ×${sp}${sp>1?'<span class="fast">ACELERADO</span>':''}</div>`;
}
function renderActions(){
  const t=UI.tab,B=(label,cls,act,arg)=>`<button class="btn ${cls}" data-act="${act}"${arg!=null?` data-arg="${arg}"`:''}>${label}</button>`;
  const out=B('Cerrar sesión','b-red','logout'),help=B('Ayuda','b-olive','help');
  let h;
  if(t==='op')h=[out,B('Limpiar campos','b-gray','opk','clr'),B('Deshacer último','b-blue','undoLast'),B('Ir al tablero','b-turq','tab','board'),help];
  else if(t==='board')h=[out,B('Deshacer último','b-blue','undoLast'),B(UI.filt.RETIRADO?'Ocultar retirados':'Ver todos','b-olive','filtToggleRet'),B('Exportar CSV','b-turq','csv'),help];
  else if(t==='runner')h=[out,B('Deshacer último','b-blue','undoLast'),B('Buscar habitación','b-turq','findRoom'),B(UI.mine?'Ver todas':'Solo mías','b-green','mine'),help];
  else if(t==='db')h=can('admin')?[out,B('Exportar CSV','b-turq','csv'),B('Exportar JSON','b-blue','json'),B('Importar JSON','b-green','import'),help]:[out,B('Exportar CSV','b-turq','csv'),B('Mapa de pisos','b-blue','sub','mapa'),B('Bitácora','b-green','sub','bitacora'),help];
  else if(t==='ai')h=[out,B('Limpiar chat','b-gray','aiClear'),B('Guardar chat (.txt)','b-blue','aiSave'),B('Configurar IA','b-turq','tab','cfg'),help];
  else if(t==='guide')h=[out,B('Descargar guía (.txt)','b-blue','guideTxt'),B('Reiniciar misiones','b-gray','mreset'),B('Ir al tablero','b-turq','tab','board'),help];
  else h=can('admin')?[out,B('Datos de ejemplo','b-blue','seed'),B('Vaciar todo','b-red','wipe'),B('Exportar JSON','b-turq','json'),help]:[out,B('Reloj de simulación','b-blue','clock'),B(S.cfg.sound?'Silenciar alertas':'Activar alertas','b-olive','sound'),B('Ir al tablero','b-turq','tab','board'),help];
  $('#actions').innerHTML=h.join('');
}

/* ================= tarjetas ================= */
function hint(o,nv){
  if(nv==='PREPARACION')return'TOCAR → SIN ASIGNAR';
  if(nv==='SIN_ASIGNAR')return'TOCAR → ASIGNARME';
  if(nv==='ASIGNADO')return'TOCAR → ENTREGADO';
  if(nv==='ROJO')return'TOCAR → RETIRADO';
  return'';
}
function timerHTML(o){
  if(o.estado==='ENTREGADO')return`<span data-t0="${o.t.entregado}">${fmtDur(simNow()-o.t.entregado)}</span>`;
  if(o.estado==='RETIRADO')return`<span>${fmtDur(o.t.retirado-o.t.entregado)}</span>`;
  return`<span data-tr="${o.t.registrado}">${fmtDur(simNow()-o.t.registrado)}</span>`;
}
function whoText(o,nv){
  const h=ts=>ts?' · '+fmtTime(ts).slice(0,5):'';
  if(nv==='ASIGNADO')return'Asignado: '+esc(o.asignado)+h(o.t.asignado);
  if(nv==='VERDE'||nv==='AMARILLO'||nv==='ROJO')return'Entregó: '+esc(o.entregado_por||o.asignado||'—')+h(o.t.entregado);
  if(nv==='RETIRADO')return'Retiró: '+esc(o.retirado_por||'—')+h(o.t.retirado);
  return'Registró: '+esc(o.creado_por||'—')+h(o.t.registrado);
}
function cardHTML(o,now){
  const nv=nivel(o,now),ro=!can('adv'),h=hint(o,nv);
  const rem=(nv==='VERDE'||nv==='AMARILLO')?`<div class="c-state" data-rem="${o.t.entregado}"${nv==='AMARILLO'?' data-pre="1"':''}>RETIRO EN ${Math.max(0,Math.ceil(S.cfg.rojo-(now-o.t.entregado)/MIN))} MIN</div>`:`<div class="c-state">${h||'&nbsp;'}</div>`;
  return`<div class="card k-${nv}${ro?' ro':''}" data-act="order" data-arg="${o.uid}">
    <div class="c-top"><span>#${esc(o.id)}</span><span>Piso ${o.piso}</span></div>
    <div class="c-room">${o.hab}</div>
    ${rem}
    <div class="c-meta"><span>${whoText(o,nv)}</span><span class="c-time">${timerHTML(o)}</span></div>
    <div class="c-btns">${o.stack.length&&(can('adv')||can('reg'))&&nv!=='RETIRADO'?`<button class="mini" data-act="undo" data-arg="${o.uid}">◄ Atrás</button>`:''}<button class="mini" data-act="detail" data-arg="${o.uid}">Detalle</button></div>
  </div>`;
}
function rcardHTML(o,now){
  const nv=nivel(o,now);let act=hint(o,nv);
  if(nv==='VERDE'||nv==='AMARILLO')act=`<span data-rem="${o.t.entregado}"${nv==='AMARILLO'?' data-pre="1"':''}>${nv==='AMARILLO'?'PRE-AVISO · ':''}RETIRO EN ${Math.max(0,Math.ceil(S.cfg.rojo-(now-o.t.entregado)/MIN))} MIN</span>`;
  if(nv==='RETIRADO')act='RETIRADO · TOCAR PARA VER';
  return`<div class="rcard k-${nv}" data-act="order" data-arg="${o.uid}">
    <div class="r-top"><span>#${esc(o.id)} · Piso ${o.piso}</span><span class="r-timer">${timerHTML(o)}</span></div>
    <div class="r-room">${o.hab}</div>
    <div class="r-state">${NV[nv].label}</div>
    <div class="r-who">${whoText(o,nv)}&nbsp;</div>
    ${o.stack.length&&can('adv')&&nv!=='RETIRADO'?`<button class="mini r-undo" data-act="undo" data-arg="${o.uid}" title="Atrás">◄</button>`:''}
    <button class="mini r-info" data-act="detail" data-arg="${o.uid}" title="Detalle">i</button>
    <div class="r-act">${act}</div>
  </div>`;
}

function visible(){

      <div class="col-b">${L.length?L.map(o=>cardHTML(o,now)).join(''):'<div class="empty">Sin órdenes</div>'}</div></div>`;
  }).join('');
}

const RUN_ORDER={ROJO:0,AMARILLO:1,VERDE:2,ASIGNADO:3,SIN_ASIGNAR:4,PREPARACION:5,RETIRADO:6};
RENDER.runner=function(){
  $('#v-runner').innerHTML=stripHTML()+'<div class="rgrid" id="rg"></div>';

function fillRunner(){
  const now=simNow(),vis=visible(),rg=$('#rg');if(!rg)return;
  vis.sort((a,b)=>{const na=nivel(a,now),nb=nivel(b,now);if(na!==nb)return RUN_ORDER[na]-RUN_ORDER[nb];
    if(na==='ROJO'||na==='AMARILLO')return b.piso-a.piso||a.hab-b.hab;return a.t.registrado-b.t.registrado});
  rg.innerHTML=vis.length?vis.map(o=>rcardHTML(o,now)).join(''):'<div class="empty" style="grid-column:1/-1;font-size:28px">No hay órdenes con estos filtros</div>';
}

const GUIDE={
concepto:()=>`<h2>¿Qué es y qué problema resuelve?</h2>
<p>Hoy la vajilla de Room Service se entrega sin registro y se recoge sin aviso. Nadie es dueño del ciclo completo, el tablero de imanes no lo mueve nadie y Amas de Llaves retira platos sin avisar. Resultado: falsas alarmas, vajilla retenida durante horas y pérdidas.</p>
<p>Esta aplicación es el <b>tablero digital que reemplaza los imanes</b>: cada orden tiene un estado que todos ven, se cambia con un solo toque y un reloj arranca en el momento exacto de la entrega.</p>
<div class="tip">Idea central, en una frase: <b>una orden, una cuenta responsable por etapa y un reloj que empieza cuando se entrega.</b></div>
<h3>Qué se rastrea</h3>
<ul><li>La <b>vajilla</b>, no al empleado.</li><li>La clave de cada orden es <b>ID Symphony + habitación + piso</b> (el piso se calcula solo a partir de la habitación).</li><li>Las 187 habitaciones del hotel están validadas: pisos 7 al 19 (11 por piso), 20 al 24 (8) y 25 (4).</li><li>No guarda datos del huésped ni el detalle del pedido: eso vive en Symphony.</li></ul>
<h3>Qué no hace todavía</h3>
<ul><li>No se conecta a Symphony: el ID se escribe a mano.</li><li>No comparte datos entre equipos distintos: es un prototipo y los datos viven en el navegador.</li><li>No define qué debe hacer Amas de Llaves si encuentra vajilla: es una decisión pendiente de gerencia.</li></ul>`,
flujo:()=>`<h2>El recorrido de una orden</h2>

<tr><td>2</td><td><span class="sw k-SIN_ASIGNAR">SIN ASIGNAR</span> gris</td><td>Equipo de Room Service, con un toque</td><td>Confirma que la orden fue vista y espera quien la lleve.</td></tr>
<tr><td>3</td><td><span class="sw k-ASIGNADO">ASIGNADO</span> azul</td><td>Un runner, con un toque</td><td>Queda el nombre de su cuenta en la tarjeta.</td></tr>

<tr><td>5</td><td><span class="sw k-AMARILLO">PRE-AVISO</span> amarillo</td><td>Automático</td><td>Del minuto ${S.cfg.amarillo} al ${S.cfg.rojo}: avisa que pronto hay que retirar.</td></tr>
<tr><td>6</td><td><span class="sw k-ROJO">RECOLECCIÓN</span> rojo</td><td>Automático</td><td>Desde el minuto ${S.cfg.rojo}: hay que ir a retirar la vajilla. Suena una alerta.</td></tr>
<tr><td>7</td><td><span class="sw k-RETIRADO">RETIRADO</span> negro</td><td>Un runner, con un toque en rojo</td><td>Cierra la orden y sale de la vista por defecto. Queda guardado el tiempo total en habitación.</td></tr>

roles:()=>`<h2>Roles y permisos</h2>

interno:()=>`<h2>Cómo funciona por dentro</h2>
<ul><li><b>Un solo archivo</b> (index.html) con HTML, CSS y JavaScript. No necesita servidor ni instalación.</li>
<li><b>Los datos viven en el navegador</b> (almacenamiento local): órdenes, cuentas, bitácora y configuración. Por eso cada equipo tiene su propia copia; las pestañas del mismo navegador se sincronizan solas.</li>
<li><b>Cada orden guarda su estado y la hora de cada paso.</b> El color verde, amarillo o rojo no se guarda: se calcula en vivo comparando «ahora menos la hora de entrega» con los umbrales. Por eso cambiar los umbrales recolorea todo al instante.</li>
<li><b>Reloj de simulación:</b> la app usa su propio reloj. Acelerarlo multiplica la velocidad del tiempo (×600 equivale a 10 minutos por segundo) sin tocar el reloj real del equipo.</li>
<li><b>Atrás:</b> cada orden guarda una pila de «fotos» de sus estados anteriores y Atrás restaura la última.</li>
<li><b>Bitácora:</b> cada registro, avance, deshacer y anulación queda con hora, cuenta y cambio de estado.</li>
<li><b>Asistente IA:</b> un motor local con reglas que consulta la base; y, si se agrega una clave, Claude responde preguntas abiertas recibiendo una copia de la base (sin cuentas ni PIN).</li>
<li><b>Pantalla:</b> el diseño es de 1920×1080 y se escala a cualquier ventana; en un teléfono cambia a vertical.</li></ul>
<div class="tip"><b>Dicho con honestidad:</b> los PIN sirven para identificar a la persona, no son seguridad real (se guardan sin cifrar en el navegador). Para producción hace falta un servidor con base de datos compartida y autenticación.</div>`,
guion:()=>`<h2>Guion de demostración (unos 7 minutos)</h2>
<p><b>Antes de empezar:</b> en Configuración toque «Datos de ejemplo», deje la velocidad en ×1 y entre como Admin.</p>
<ol>
<li><b>El problema (30 s).</b> «Hoy los imanes no los mueve nadie y la vajilla desaparece.» Muestre el Tablero con las columnas de colores.</li>
<li><b>Registro (1 min).</b> En Operadora cree la orden 1204. Muestre que rechaza un ID repetido y una habitación que no existe.</li>
<li><b>Un toque por paso (1 min).</b> Entre como Ana y avance la orden: blanco, gris, azul con su nombre, verde.</li>
<li><b>Vista Runner (1 min).</b> «Esto es lo único que ve un salonero: tarjetas grandes y un toque.»</li>
<li><b>El reloj (1 min).</b> Active ×600: verde, amarillo, rojo y la alerta sonora. Diga que ese es el momento de ir a retirar.</li>
<li><b>Cierre y errores (30 s).</b> Retire la roja, muestre «◄ Atrás» y los filtros (retirados ocultos por defecto).</li>
<li><b>Base de datos (1 min).</b> Resumen con promedios, Mapa de pisos y Bitácora: «todo queda registrado».</li>
<li><b>Asistente (30 s).</b> Pregunte «¿Qué hay que retirar ahora?».</li>
<li><b>Cierre (30 s).</b> Diga qué es prototipo y qué falta (vea la sección 7).</li></ol>`,
preguntas:()=>`<h2>Preguntas que pueden hacer los supervisores</h2>
<table><thead><tr><th>Pregunta</th><th>Respuesta honesta</th></tr></thead><tbody>
<tr><td>¿Se conecta con Symphony?</td><td>No. El ID se escribe a mano. Integrarlo requiere al proveedor o a TI del hotel.</td></tr>
<tr><td>¿Funciona en varios dispositivos a la vez?</td><td>Hoy no: cada navegador tiene su copia. Para producción se necesita un servidor con base de datos compartida.</td></tr>
<tr><td>¿Qué pasa si el huésped termina antes del minuto ${S.cfg.rojo}?</td><td>Un toque en verde o amarillo pide confirmación y registra un retiro anticipado.</td></tr>
<tr><td>¿Y si alguien toca por error?</td><td>«◄ Atrás» o «Deshacer último». Además todo queda en la bitácora.</td></tr>
<tr><td>¿Mide la eficiencia de cada empleado?</td><td>Registra la cuenta de cada paso para tener trazabilidad. No hay rankings ni puntajes; usar esos datos para evaluar sería una decisión de gerencia.</td></tr>
<tr><td>¿Quién retira la vajilla?</td><td>El equipo de Room Service cuando una orden pasa a rojo. Falta que gerencia decida qué hace Amas de Llaves si encuentra vajilla en un pasillo.</td></tr>
<tr><td>¿Por qué ${S.cfg.amarillo} y ${S.cfg.rojo} minutos?</td><td>Son valores configurables que se pueden ajustar con la operación real.</td></tr>
<tr><td>¿Qué datos del huésped guarda?</td><td>Ninguno. Solo ID Symphony, habitación, piso y las horas de cada paso.</td></tr>
<tr><td>¿Qué tan seguro es?</td><td>Es un prototipo: los PIN identifican a la persona pero no cifran nada. Producción exige autenticación real.</td></tr>
</tbody></table>
<h3>Qué falta para pasar a producción</h3>
<ul><li>Servidor y base de datos compartida entre pantallas.</li><li>Autenticación segura de cuentas.</li><li>Integración (o carga automática) del ID desde Symphony.</li><li>Acuerdo con gerencia sobre el rol de Amas de Llaves y sobre el uso de los datos por cuenta.</li><li>Prueba piloto en un turno real y ajuste de los minutos del semáforo.</li></ul>`
};

function aiLocal(q){
  const t=norm(q),now=simNow(),A=S.orders.filter(o=>o.estado!=='ANULADA'),M=metrics();
  const line=o=>`• Hab. ${o.hab} (#${o.id}, piso ${o.piso}) — ${NV[nivel(o,now)].label}${o.t.entregado&&o.estado!=='RETIRADO'?`, ${Math.floor(minEnHab(o,now))} min en habitación`:''}${o.asignado?`, asignada a ${o.asignado}`:''}`;
  if(/\bpin\b|contrasena|usuarios|cuentas de acceso/.test(t))return{text:'Por seguridad no tengo acceso a los PIN ni a la tabla de cuentas. Sí puedo consultar órdenes, estados y tiempos.'};
  const nums=t.match(/\d{3,8}/g)||[];
  for(const n of nums){
    const byId=A.filter(o=>o.id===n.replace(/^0+/,''));
    if(byId.length)return{text:byId.map(o=>`Orden #${o.id}\n${line(o)}\nRegistrada ${fmtTime(o.t.registrado)} por ${o.creado_por}. Entregó: ${o.entregado_por||'—'}. Retiró: ${o.retirado_por||'—'}.`).join('\n\n'),acts:[{label:'Ver detalle',act:'detail',arg:byId[0].uid}]};
    const v=validarHab(n);
    if(v.ok){const L=A.filter(o=>o.hab===v.hab);
      return L.length?{text:`Habitación ${v.hab} (piso ${v.piso}):\n`+L.map(line).join('\n'),acts:[{label:'Ver habitación',act:'room',arg:v.hab}]}:{text:`La habitación ${v.hab} (piso ${v.piso}) no tiene órdenes registradas.`}}
  }
  const pm=t.match(/piso\s*(\d+)/);
  if(pm&&!/mas|mayor|cuales/.test(t)){const L=A.filter(o=>o.piso===+pm[1]);return{text:L.length?`Piso ${pm[1]}: ${L.length} orden(es).\n`+L.map(line).join('\n'):`El piso ${pm[1]} no tiene órdenes registradas.`}}
  if(/retirar|recolec|recoger|rojo|pendiente de retiro|ahora/.test(t)){
    const R=A.filter(o=>nivel(o,now)==='ROJO').sort((a,b)=>b.piso-a.piso),Y=A.filter(o=>nivel(o,now)==='AMARILLO');
    return{text:(R.length?`Hay ${R.length} habitación(es) para recolectar ya (≥ ${S.cfg.rojo} min), de piso alto a bajo:\n${R.map(line).join('\n')}`:'No hay recolecciones vencidas en este momento.')+(Y.length?`\n\nEn pre-aviso (≥ ${S.cfg.amarillo} min): ${Y.length}\n${Y.map(line).join('\n')}`:''),acts:R.length?[{label:'Ver en el tablero',act:'viewFilt',arg:'ROJO'}]:[]};
  }
  if(/pre.?aviso|amarillo/.test(t)){const Y=A.filter(o=>nivel(o,now)==='AMARILLO');return{text:Y.length?`En pre-aviso: ${Y.length}\n${Y.map(line).join('\n')}`:'No hay órdenes en pre-aviso.',acts:Y.length?[{label:'Ver en el tablero',act:'viewFilt',arg:'AMARILLO'}]:[]}}
  if(/promedio|retencion|tiempo medio|cuanto tarda/.test(t))return{text:`Retención promedio (entrega → retiro): ${fmtMin(M.avgRet)}\nPromedio registro → entrega: ${fmtMin(M.avgEnt)}\nBase: ${M.by.RETIRADO} orden(es) retiradas.`};
  if(/piso/.test(t)&&/(mas|mayor|pendiente|vajilla)/.test(t)){const p=Object.entries(M.pisos).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);return{text:p.length?'Vajilla actualmente en habitaciones, por piso:\n'+p.map(([k,n])=>`• Piso ${k}: ${n}`).join('\n'):'No hay vajilla entregada pendiente de retiro.'}}
  if(/quien|asignad|runner|cuenta|salonero|entreg/.test(t)){
    const as=A.filter(o=>o.estado==='ASIGNADO');const by={};A.filter(o=>o.entregado_por).forEach(o=>by[o.entregado_por]=(by[o.entregado_por]||0)+1);
    return{text:(as.length?`Órdenes asignadas por entregar:\n${as.map(o=>`• Hab. ${o.hab} → ${o.asignado}`).join('\n')}`:'No hay órdenes asignadas pendientes de entrega.')+(Object.keys(by).length?`\n\nEntregas registradas por cuenta:\n${Object.entries(by).map(([k,n])=>`• ${k}: ${n}`).join('\n')}`:'')};
  }
  if(/lent|mas tiempo|mayor tiempo|critic|peor/.test(t)){const L=A.filter(o=>o.estado==='ENTREGADO').sort((a,b)=>a.t.entregado-b.t.entregado).slice(0,5);return{text:L.length?'Mayor tiempo en habitación:\n'+L.map(line).join('\n'):'No hay órdenes entregadas en habitación.'}}
  if(/retirad/.test(t)){const L=A.filter(o=>o.estado==='RETIRADO').sort((a,b)=>b.t.retirado-a.t.retirado).slice(0,6);return{text:`Retiradas: ${M.by.RETIRADO}\n`+L.map(line).join('\n')}}
  if(/resumen|turno|cuant|estado|total|general|hola/.test(t))return{text:`Resumen (${fmtDT(now)}):\n${LEVELS.map(k=>`• ${NV[k].label}: ${M.by[k]}`).join('\n')}\n\nTotal: ${M.total} · Activas: ${M.activas} · Anuladas: ${M.anuladas}\nRetención promedio: ${fmtMin(M.avgRet)}`};
  if(/ayuda|puedes|que sabes/.test(t))return{text:'Puedo consultar: una habitación («1204») o ID («#88410»), un piso («piso 12»), lo que hay que retirar, pre-avisos, promedios de tiempo, pisos con más vajilla, quién tiene asignadas órdenes, órdenes más lentas y el resumen general. Con una clave de Claude en Configuración respondo preguntas abiertas.'};
  return{text:'No entendí la consulta. Pruebe con una habitación («1204»), un piso («piso 12»), «qué hay que retirar», «resumen» o «promedio de retención». Con una clave de Claude en Configuración puedo responder preguntas abiertas.'};
}
async function aiClaude(q){

    ordenes:S.orders.map(o=>({id:o.id,hab:o.hab,piso:o.piso,estado:nivel(o,now),registrada:fmtTime(o.t.registrado),asignada_a:o.asignado,entrego:o.entregado_por,entregada:o.t.entregado?fmtTime(o.t.entregado):null,min_en_habitacion:o.t.entregado?Math.round(minEnHab(o,now)):null,retiro:o.retirado_por,retiro_anticipado:!!o.anticipado})),
    bitacora_reciente:S.log.slice(-40).map(l=>`${fmtTime(l.ts)} ${l.user} ${l.accion} #${l.orden} hab ${l.hab} ${l.de}→${l.a}`)};
  const system='Eres el asistente de la base de datos de control de vajilla de Room Service de un hotel. Estados: EN PREPARACIÓN → SIN ASIGNAR → ASIGNADO → ENTREGADO (verde 0–pre-aviso, amarillo pre-aviso–recolección, rojo desde recolección) → RETIRADO. No tienes acceso a cuentas ni PIN y no debes inventarlos. Responde en español, breve y solo con datos de la base JSON adjunta; si algo no está en los datos, dilo.\n\nBASE DE DATOS:\n'+JSON.stringify(snap);
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.cfg.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.cfg.model||'claude-sonnet-5-5',max_tokens:900,system,messages:[...UI.aiHist.slice(-8),{role:'user',content:q}]})});
  const d=await r.json();
  if(!r.ok)throw new Error((d.error&&d.error.message)||('HTTP '+r.status));
  return(d.content||[]).map(c=>c.text||'').join('').trim();
}

let AC=null;
function ensureAudio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,n){
  if(!AC||!S.cfg.sound)return;
  try{for(let i=0;i<n;i++){const t=AC.currentTime+i*.3,o=AC.createOscillator(),g=AC.createGain();
    o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.24);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.26)}}catch(e){}
}

  $$('[data-t0]').forEach(e=>e.textContent=fmtDur(now-(+e.dataset.t0)));
  $$('[data-tr]').forEach(e=>e.textContent=fmtDur(now-(+e.dataset.tr)));
  $$('[data-rem]').forEach(e=>{const m=Math.max(0,Math.ceil(S.cfg.rojo-(now-(+e.dataset.rem))/MIN));e.textContent=(e.dataset.pre?'PRE-AVISO · ':'')+'RETIRO EN '+m+' MIN'});
}
function tick(force){
  if(!S)return;
  const u=cur(),now=simNow();
  if(!u)return;
  const sig=S.orders.map(o=>o.uid+':'+nivel(o,now)).join('|')+S.cfg.amarillo+S.cfg.rojo;
  let beepY=false,beepR=false;
  S.orders.forEach(o=>{const n=nivel(o,now),p=lastLv[o.uid];
    if(!firstTick&&p&&p!==n){if(n==='AMARILLO')beepY=true;if(n==='ROJO')beepR=true}
    lastLv[o.uid]=n});
  if(beepR){beep(880,2);toast('Hay vajilla en RECOLECCIÓN (rojo)','err')}else if(beepY){beep(660,1);toast('Pre-aviso: vajilla próxima a retirar','ok')}
  firstTick=false;
  renderStatus();
  if(sig!==lastSig||force){
    lastSig=sig;
    if(['board','runner','op'].includes(UI.tab)||(UI.tab==='db'&&['resumen','mapa'].includes(UI.sub)))render();
  }
  updateTimers(now);
}

/* ================= teclado físico ================= */
document.addEventListener('keydown',e=>{
  if(!$('#login').classList.contains('off')){
    if(/^\d$/.test(e.key))ACT.lg(e.key);else if(e.key==='Backspace'){UI.pin=UI.pin.slice(0,-1);drawPin()}else if(e.key==='Enter')ACT.lg('go');
    return;
  }
  if(e.key==='Escape'&&$('#modal').classList.contains('on')){closeDlg();return}
  const a=document.activeElement;
  if(UI.tab!=='op'||$('#modal').classList.contains('on')||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))return;
  if(/^\d$/.test(e.key))ACT.opk(e.key);
  else if(e.key==='Backspace')ACT.opk('bs');
  else if(e.key==='Tab'){e.preventDefault();ACT.opk('next')}
  else if(e.key==='Enter')ACT.opk(UI.opF==='id'?'next':'send');
});

['json','import','seed','wipe'].forEach(n=>{const f=ACT[n];ACT[n]=(...a)=>can('admin')?f(...a):deny('Solo el administrador puede hacer esto')});

/* ================= arranque ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];if(f){ensureAudio();f(el.dataset.arg,el)}
});
window.addEventListener('resize',fit);
window.addEventListener('storage',e=>{
  if(e.key!==LS_KEY||!e.newValue)return;
  try{S=normalizeState(JSON.parse(e.newValue))}catch(x){return}
  if(cur()&&!$('#modal').classList.contains('on'))render();
});
function init(){
  S=load();fit();
  $('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeDlg()});
  $('#fimp').addEventListener('change',onImportFile);
  $('#lgdemo').dataset.act='demo';
  S.orders.forEach(o=>lastLv[o.uid]=nivel(o));
  if(cur())render();else showLogin();
  setInterval(()=>tick(),1000);
}
init();
</script>
</body></html>
